name: Build Android APK (Personal Student OS)
on: push: branches: - main workflow_dispatch:
permissions: contents: write
jobs: build-apk: name: Build Release APK runs-on: ubuntu-latest
steps: - name: Checkout Repository uses: actions/checkout@v4
- name: Setup Java 17 uses: actions/setup-java@v4 with: distribution: 'temurin' java-version: '17'
- name: Setup Flutter (Stable 3.24+) uses: subosito/flutter-action@v2 with: channel: 'stable' cache: true
- name: Lengkapi Kerangka Proyek Flutter & Android run: | if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml manifest.bak; fi flutter create . --project-name personal_student_os --platforms android if [ -f manifest.bak ]; then mv manifest.bak android/app/src/main/AndroidManifest.xml; fi if [ -f android/app/build.gradle.kts ]; then sed -i 's/compileOptions {/compileOptions {\n isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts && printf '\ndependencies {\n coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts; fi printf 'name: personal_student_os\ndescription: Aplikasi produktivitas pelajar 100%% offline-first.\npublish_to: none\nversion: 1.0.0+1\n\nenvironment:\n sdk: ">=3.4.0 <4.0.0"\n\ndependencies:\n flutter:\n sdk: flutter\n flutter_localizations:\n sdk: flutter\n sqflite: ^2.3.3+1\n path: ^1.9.0\n provider: ^6.1.2\n image_picker: ^1.1.2\n path_provider: ^2.1.4\n flutter_local_notifications: ^17.2.3\n intl: any\n\ndev_dependencies:\n flutter_test:\n sdk: flutter\n flutter_lints: ^4.0.0\n\nflutter:\n uses-material-design: true\n' > pubspec.yaml
- name: Ambil Dependensi (flutter pub get) run: flutter pub get
- name: Build Android APK Release run: flutter build apk --release
- name: Rename APK Output run: | mkdir -p release-output cp build/app/outputs/flutter-apk/app-release.apk release-output/Personal-Student-OS-v1.0.${{ github.run_number }}.apk
- name: Upload ke GitHub Actions Artifacts uses: actions/upload-artifact@v4 with: name: Personal-Student-OS-APK path: release-output/Personal-Student-OS-v1.0.${{ github.run_number }}.apk retention-days: 30
- name: Publish ke GitHub Releases uses: softprops/action-gh-release@v2 with: tag_name: v1.0.{{ github.run_number }} name: Personal Student OS v1.0.{{ github.run_number }} body: | Build otomatis APK Android Personal Student OS (100% Offline-First). - Commit: {{ github.sha }} - Unduh file `.apk` di bawah ini dan instal langsung di HP Android. files: release-output/Personal-Student-OS-v1.0.{{ github.run_number }}.apk
