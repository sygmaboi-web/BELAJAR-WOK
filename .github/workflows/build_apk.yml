name: Build Android APK (Personal Student OS)
​on:
push:
branches:
- main
workflow_dispatch:
​permissions:
contents: write
​jobs:
build-apk:
name: Build Release APK
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Flutter (Stable 3.24+)
uses: subosito/flutter-action@v2
with:
channel: 'stable'
cache: true
​- name: Lengkapi Kerangka Proyek Flutter & Android
run: |
if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml manifest.bak; fi
flutter create . --project-name personal_student_os --platforms android
if [ -f manifest.bak ]; then mv manifest.bak android/app/src/main/AndroidManifest.xml; fi
python3 -c '
import pathlib
kts = pathlib.Path("android/app/build.gradle.kts")
if kts.exists():
text = kts.read_text()
if "isCoreLibraryDesugaringEnabled" not in text:
text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
text += "\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n"
kts.write_text(text)
'
cat << 'EOF' > pubspec.yaml
name: personal_student_os
description: Aplikasi produktivitas pelajar 100% offline-first dengan 6 modul terintegrasi.
publish_to: 'none'
version: 1.0.0+1
​environment:
sdk: '>=3.4.0 <4.0.0'
​dependencies:
flutter:
sdk: flutter
flutter_localizations:
sdk: flutter
sqflite: ^2.3.3+1
path: ^1.9.0
provider: ^6.1.2
image_picker: ^1.1.2
path_provider: ^2.1.4
flutter_local_notifications: ^17.2.3
intl: any
​dev_dependencies:
flutter_test:
sdk: flutter
flutter_lints: ^4.0.0
​flutter:
uses-material-design: true
EOF
​- name: Ambil Dependensi (flutter pub get)
run: flutter pub get
​- name: Build Android APK Release
run: flutter build apk --release
​- name: Rename APK Output
run: |
mkdir -p release-output
cp build/app/outputs/flutter-apk/app-release.apk release-output/Personal-Student-OS-v1.0.${{ github.run_number }}.apk
​- name: Upload ke GitHub Actions Artifacts
uses: actions/upload-artifact@v4
with:
name: Personal-Student-OS-APK
path: release-output/Personal-Student-OS-v1.0.${{ github.run_number }}.apk
retention-days: 30
​- name: Publish ke GitHub Releases
uses: softprops/action-gh-release@v2
with:
tag_name: v1.0.{{ github.run_number }}
name: Personal Student OS v1.0.{{ github.run_number }}
body: |
Build otomatis APK Android Personal Student OS (100% Offline-First).
- Commit: {{ github.sha }}
- Unduh file `.apk` di bawah ini dan instal langsung di HP Android.
files: release-output/Personal-Student-OS-v1.0.{{ github.run_number }}.apk
